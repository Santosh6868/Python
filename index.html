<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14181f"><link rel="manifest" href="manifest.json"><title>PyPath</title>
<style>
:root{--bg:#14181f;--sf:#1e242e;--tx:#e8ecf2;--mu:#8d97a8;--ac:#f2c94c;--ok:#5fd38d;--cd:#10141a}
@media(prefers-color-scheme:light){:root{--bg:#f4f5f7;--sf:#fff;--tx:#1a1f29;--mu:#5d6778;--ac:#a06a00;--ok:#18864b;--cd:#eceef2}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.6 Georgia,serif;padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
h1,h2,h3,button,nav,.m{font-family:system-ui,sans-serif}
main{max-width:640px;margin:auto;padding:16px}
h1{font-size:26px;margin:8px 0 12px}h2{font-size:15px;color:var(--mu);margin:22px 0 8px;font-weight:600}
.t{display:flex;justify-content:space-between;width:100%;background:var(--sf);color:var(--tx);border:0;border-radius:10px;padding:13px 14px;margin:0 0 6px;font-size:15px;text-align:left}
.t.na{color:var(--mu)}.ok{color:var(--ok)}
pre{background:var(--cd);padding:12px;border-radius:8px;overflow-x:auto;font:14px/1.5 ui-monospace,Menlo,monospace}
.b{background:var(--ac);color:#14181f;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;margin:6px 6px 6px 0}
.g{background:var(--sf);color:var(--tx)}.o{display:block;width:100%;text-align:left;background:var(--sf);color:var(--tx);border:2px solid transparent;border-radius:10px;padding:11px;margin:6px 0;font-size:15px}
.card{background:var(--sf);border-radius:12px;padding:14px;margin:8px 0}
.big{font:700 44px system-ui;color:var(--ac)}.row{display:flex;gap:10px}.row>*{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font:12px system-ui;text-align:center}
.cal div{padding:8px 0;border-radius:6px;background:var(--cd);color:var(--mu)}.cal .on{background:var(--ac);color:#14181f}
.bar{height:8px;background:var(--cd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--sf);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px;background:none;border:0;color:var(--mu);font-size:15px}nav .a{color:var(--ac);font-weight:700}
button:focus-visible{outline:2px solid var(--ac)}input{font-size:16px;padding:8px;border-radius:8px;border:0;background:var(--cd);color:var(--tx)}
</style></head><body><main id="app"></main>
<nav><button id="n0" onclick="go(0)">Learn</button><button id="n1" onclick="go(1)">Streak</button></nav>
<script src="lessons.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const add=(k,n)=>{const d=new Date(k+"T00:00");d.setDate(d.getDate()+n);return dk(d)};
const today=dk(new Date());
let days=ld("days",[]),prog=ld("prog",{}),IV=[1,3,7,30];
if(!days.includes(today)){days.push(today);sv("days",days)}
const SEC=typeof SECTIONS!=="undefined"?SECTIONS:[],all=SEC.flatMap(s=>s.t);
const key=n=>n.n;
function streaks(){const s=new Set(days);let cur=0,d=today;if(!s.has(d))d=add(d,-1);while(s.has(d)){cur++;d=add(d,-1)}
 let best=0,run=0,prev=null;[...s].sort().forEach(x=>{run=prev&&add(prev,1)===x?run+1:1;best=Math.max(best,run);prev=x});return{cur,best}}
function due(){return all.filter(t=>{const p=prog[key(t)];return p&&p.n<4&&today>=add(p.d,IV[p.n])})}
function go(i){$("n0").className=i?"":"a";$("n1").className=i?"a":"";i?streak():home();scrollTo(0,0)}
function home(){if(!all.length){$("app").innerHTML="<h1>Lessons file not found</h1><p>The app cannot find <b>lessons.js</b>. In your GitHub repository, make sure a file named exactly <b>lessons.js</b> (lowercase, no spaces or (1)) sits in the same folder as index.html. Then reload the page twice.</p>";return}const dn=all.filter(t=>prog[key(t)]).length,dv=due();
 let h=`<h1>PyPath</h1><div class="m">${dn} of ${all.length} topics done</div><div class="bar"><i style="width:${dn/all.length*100}%"></i></div>`;
 if(dv.length)h+=`<h2>Review today</h2>`+dv.map(t=>btn(t)).join("");
 SEC.forEach(s=>{h+=`<h2>${s.s}</h2>`+s.t.map(btn).join("")});$("app").innerHTML=h}
const btn=t=>`<button class="t ${t.b?"":"na"}" onclick="open_('${key(t).replace(/'/g,"\\'")}')"><span>${esc(t.n)}</span><span class="ok">${prog[key(t)]?"✓":""}</span></button>`;
function open_(k){const t=all.find(x=>key(x)===k);if(!t.b){$("app").innerHTML=`<button class="b g" onclick="go(0)">Back</button><h1>${esc(t.n)}</h1><p>This lesson is not written yet. Ask Claude for the next batch and paste it into lessons.js.</p>`;return}
 const p=prog[k];$("app").innerHTML=`<button class="b g" onclick="go(0)">Back</button><h1>${esc(t.n)}</h1><p>${esc(t.b)}</p><pre>${esc(t.c)}</pre>
 <div class="card"><b>Common mistake.</b> ${esc(t.m)}</div><div class="card"><b>Remember.</b> ${esc(t.r)}</div>
 <h2>Quick check</h2><div><b>${esc(t.q)}</b>${t.o.map((o,i)=>`<button class="o" onclick="ans(this,${i},${t.a})">${esc(o)}</button>`).join("")}</div>
 <button class="b" onclick="done('${k.replace(/'/g,"\\'")}')">${p?(due().includes(t)?"Mark reviewed":"Done ✓"):"Mark as done"}</button>`}
function ans(b,i,a){b.style.borderColor=i===a?"var(--ok)":"#d9534f"}
function done(k){const p=prog[k],t=all.find(x=>key(x)===k);if(!p)prog[k]={d:today,n:0};else if(due().includes(t))p.n++;sv("prog",prog);go(0)}
function streak(){const{cur,best}=streaks(),now=new Date(),y=now.getFullYear(),m=now.getMonth(),dim=new Date(y,m+1,0).getDate(),off=(new Date(y,m,1).getDay()+6)%7;
 const mc=days.filter(d=>d.startsWith(y+"-"+String(m+1).padStart(2,"0"))).length,yc=days.filter(d=>d.startsWith(y+"-")).length;
 let c=["M","T","W","T","F","S","S"].map(x=>`<div>${x}</div>`).join("")+"<div style='background:none'></div>".repeat(off);
 for(let i=1;i<=dim;i++){const k=y+"-"+String(m+1).padStart(2,"0")+"-"+String(i).padStart(2,"0");c+=`<div class="${days.includes(k)?"on":""}">${i}</div>`}
 $("app").innerHTML=`<h1>Your streak</h1><div class="row"><div class="card"><div class="big">${cur}</div>day streak</div><div class="card"><div class="big">${best}</div>best streak</div></div>
 <div class="row"><div class="card"><b>${days.includes(today)?1:0}</b> today</div><div class="card"><b>${mc}</b> this month</div><div class="card"><b>${yc}</b> this year</div></div>
 <h2>${now.toLocaleString("en",{month:"long",year:"numeric"})}</h2><div class="cal">${c}</div>
 <h2>Daily reminder</h2><div class="card"><input type="time" id="rt" value="${ld("rt","19:00")}" onchange="sv('rt',this.value)"> <button class="b" onclick="remind()">Enable</button>
 <div class="m" style="color:var(--mu);font-size:13px">Works while the app is open. For a reliable alarm, add a phone alarm too.</div></div>`}
function remind(){if(!("Notification" in window))return alert("Notifications are not supported here.");Notification.requestPermission().then(p=>{if(p==="granted")alert("Reminder on while the app is open.")})}
setInterval(()=>{const r=ld("rt",null),n=new Date(),hm=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
 if(r===hm&&window.Notification&&Notification.permission==="granted"&&ld("rn","")!==today){sv("rn",today);new Notification("PyPath",{body:"Time for today's Python lesson."})}},30000);
all.forEach((t,i)=>{if(t.b)t.b=t.b});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
go(0);
</script></body></html>
