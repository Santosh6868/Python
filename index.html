<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14181f"><link rel="manifest" href="manifest.json"><title>PyPath</title>
<style>
:root{--bg:#14181f;--sf:#1e242e;--tx:#e8ecf2;--mu:#8d97a8;--ac:#f2c94c;--ok:#5fd38d;--cd:#10141a}
@media(prefers-color-scheme:light){:root{--bg:#f4f5f7;--sf:#fff;--tx:#1a1f29;--mu:#5d6778;--ac:#a06a00;--ok:#18864b;--cd:#eceef2}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.6 Georgia,serif;padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
h1,h2,h3,button,nav,.m{font-family:system-ui,sans-serif}
main{max-width:640px;margin:auto;padding:16px}
h1{font-size:26px;margin:8px 0 12px}h2{font-size:15px;color:var(--mu);margin:22px 0 8px;font-weight:600}
.t{display:flex;justify-content:space-between;width:100%;background:var(--sf);color:var(--tx);border:0;border-radius:10px;padding:13px 14px;margin:0 0 6px;font-size:15px;text-align:left}
.t.na{color:var(--mu)}.ok{color:var(--ok)}
pre{background:var(--cd);padding:12px;border-radius:8px;overflow-x:auto;font:14px/1.5 ui-monospace,Menlo,monospace}
.b{background:var(--ac);color:#14181f;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;margin:6px 6px 6px 0}
.g{background:var(--sf);color:var(--tx)}.o{display:block;width:100%;text-align:left;background:var(--sf);color:var(--tx);border:2px solid transparent;border-radius:10px;padding:11px;margin:6px 0;font-size:15px}
.card{background:var(--sf);border-radius:12px;padding:14px;margin:8px 0}
.big{font:700 44px system-ui;color:var(--ac)}.row{display:flex;gap:10px}.row>*{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font:12px system-ui;text-align:center}
.cal div{padding:8px 0;border-radius:6px;background:var(--cd);color:var(--mu)}.cal .on{background:var(--ac);color:#14181f}
.bar{height:8px;background:var(--cd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--sf);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px;background:none;border:0;color:var(--mu);font-size:15px}nav .a{color:var(--ac);font-weight:700}
button:focus-visible{outline:2px solid var(--ac)}input{font-size:16px;padding:8px;border-radius:8px;border:0;background:var(--cd);color:var(--tx)}
</style></head><body><main id="app"></main>
<nav><button id="n0" onclick="go(0)">Learn</button><button id="n1" onclick="go(1)">Streak</button></nav>
<script>
// L(name, explanation, code, commonMistake, recap, question, options, answerIndex)
// Topics WITHOUT lesson text show "coming soon". To add a lesson, replace T("Name") with L("Name", ...).
const L=(n,b,c,m,r,q,o,a)=>({n,b,c,m,r,q,o,a}), T=n=>({n});
const SECTIONS=[
{s:"1. Learn the Basics",t:[
L("Basic Syntax","Python marks blocks with indentation (4 spaces), not braces. A line ending in a colon opens a block. Names are case-sensitive.",`if 3 > 2:\n    print("yes")`,"Mixing tabs and spaces raises IndentationError.","Colon + indentation = block.","What marks a block in Python?",["Braces","Indentation","Semicolons"],1),
L("Variables and Data Types","A variable is a name pointing to a value. No declaration needed. Core types: int, float, str, bool, None.",`age = 30\nprice = 9.99\nname = "Ana"\nprint(type(age))`,"Naming a variable list or str hides the built-in.","The value has the type, not the name.","type(3.0) is?",["int","float","str"],1),
L("Operators","Arithmetic: + - * / // % **. Comparison: == != < >. Logic: and, or, not. A single / always returns a float.",`print(7/2, 7//2, 7%2, 2**3)\n# 3.5 3 1 8`,"= assigns, == compares.","/ is true division, // is floor division.","What is 7 // 2?",["3","3.5","4"],0),
L("Working with Strings","Strings are immutable sequences. Use f-strings to format, slices to cut, methods to transform.",`s = "python"\nprint(s[0], s[-1], s[1:4])\nprint(f"I love {s.upper()}")\nprint("a,b".split(","))`,"s[0] = 'P' fails. Build a new string instead.","Immutable: methods return new strings.","What does s[-1] give for 'python'?",["p","n","error"],1),
L("Loops","for walks any iterable; while repeats on a condition. break exits, continue skips. range() makes number sequences; enumerate() gives index and value.",`for i, ch in enumerate("abc"):\n    print(i, ch)\nn = 3\nwhile n:\n    n -= 1`,"A while loop that never changes its condition runs forever.","Prefer for + enumerate over manual counters.","range(3) yields?",["1,2,3","0,1,2","0,1,2,3"],1),
L("List","Ordered, mutable collection. Append, insert, pop, sort, slice.",`xs = [3, 1, 2]\nxs.append(4)\nxs.sort()\nprint(xs, xs[1:3])`,"b = a does not copy a list. Use a.copy().","Lists are mutable and ordered.","Which copies a list?",["b = a","b = a.copy()","b == a"],1),
L("Tuple","Ordered and immutable. Good for fixed records and as dict keys. A one-item tuple needs a trailing comma.",`pt = (2, 5)\nx, y = pt\none = (7,)`,"(7) is just the number 7.","Tuple = fixed list.","Can you change t[0] on a tuple?",["Yes","No"],1),
L("Set","Unordered collection of unique items. Fast membership tests and set math.",`a = {1, 2, 3}\nb = {3, 4}\nprint(a & b, a | b, 2 in a)`,"{} is an empty dict. Use set() for an empty set.","Sets remove duplicates.","Empty set is written?",["{}","set()","[]"],1),
L("Dictionary","Key-value mapping with fast lookup. Keys must be hashable. Use get() to avoid KeyError.",`d = {"a": 1}\nd["b"] = 2\nprint(d.get("z", 0))\nfor k, v in d.items():\n    print(k, v)`,"d['z'] raises KeyError if missing.","get() gives a safe default.","d.get('z', 0) when z is missing gives?",["KeyError","0","None"],1),
L("Type Casting","Convert with int(), float(), str(), bool(), list(). Invalid conversions raise ValueError.",`print(int("42") + 1)\nprint(float(3), str(9), bool(""))\n# int("4.5") -> ValueError`,"int('4.5') fails. Use int(float('4.5')).","Convert explicitly; never assume.","bool('') is?",["True","False"],1),
L("Functions and Built-in Functions","def defines a function; return sends a value back. Defaults and keyword args make calls readable. Learn built-ins: len, sum, min, max, sorted, zip, map, any, all.",`def area(w, h=1):\n    return w * h\nprint(area(3), area(h=4, w=2))\nprint(sum([1, 2, 3]), sorted("cab"))`,"Mutable default args (def f(x=[])) are shared between calls.","No return means the function returns None.","A function without return gives?",["0","None","error"],1),
L("Exceptions","try/except handles errors, else runs if none occurred, finally always runs. Catch specific exceptions. raise signals your own.",`try:\n    n = int("x")\nexcept ValueError as e:\n    print("bad:", e)\nfinally:\n    print("done")`,"A bare except: hides real bugs.","Catch specific errors only.","Which block always runs?",["else","finally","except"],1),
L("Comments","# starts a comment. Triple-quoted strings at the top of a function are docstrings. Explain why, not what.",`# add tax\ndef f(x):\n    """Return x plus 10% tax."""\n    return x * 1.1`,"Comments that repeat the code add noise.","Docstrings document; # comments explain.","Which starts a comment?",["//","#","--"],1),
L("Type Annotations","Hints state expected types. Python does not enforce them at runtime; tools like mypy check them.",`def greet(name: str, n: int = 1) -> str:\n    return name * n\nxs: list[int] = [1, 2]`,"Hints are not enforced when the code runs.","Hints help tools and readers.","Does Python enforce hints at runtime?",["Yes","No"],1)
]},
{s:"2. Data Structures and Algorithms",t:[
L("Arrays and Linked Lists","A Python list is a dynamic array: indexing and appending at the end are fast (O(1)); inserting or deleting near the front is slow (O(n)). A linked list stores nodes that point to the next node: inserting after a known node is cheap, but there is no direct indexing. Python has no built-in linked list, so you build nodes with a class.",[`xs = [10, 20, 30]\nxs.append(40)\nxs.insert(0, 5)\nprint(xs[2], len(xs))`,`class Node:\n    def __init__(self, val, nxt=None):\n        self.val, self.nxt = val, nxt\nhead = Node(1, Node(2, Node(3)))\ncur = head\nwhile cur:\n    print(cur.val)\n    cur = cur.nxt`,`prev, cur = None, head\nwhile cur:\n    nxt = cur.nxt\n    cur.nxt = prev\n    prev, cur = cur, nxt\nhead = prev  # reversed`],"Losing the rest of the list by overwriting cur.nxt before saving it.","Array = fast index. Linked list = fast insert after a node.","Which is fast on a Python list?",["insert at index 0","append at end","delete from middle"],1),
L("HashMap","A dict is a hash table. Lookup, insert and delete are O(1) on average. Keys must be hashable (immutable): str, int, tuple yes; list no.",[`words = "to be or not to be".split()\ncount = {}\nfor w in words:\n    count[w] = count.get(w, 0) + 1\nprint(count)`,`from collections import defaultdict\ng = defaultdict(list)\nfor w in ["tea", "eat", "ate"]:\n    g["".join(sorted(w))].append(w)\nprint(dict(g))`,`def two_sum(nums, target):\n    seen = {}\n    for i, n in enumerate(nums):\n        if target - n in seen:\n            return seen[target - n], i\n        seen[n] = i\nprint(two_sum([2, 7, 11], 9))`],"Using a list as a key raises TypeError: unhashable type.","Dict = O(1) lookup by hashable key.","Which can be a dict key?",["[1, 2]","(1, 2)","{1, 2}"],1),
L("Heap, Stack and Queue","Stack: last in, first out (list append/pop). Queue: first in, first out (collections.deque, popleft is O(1)). Heap: always gives the smallest item first (heapq).",[`stack = []\nstack.append(1); stack.append(2)\nprint(stack.pop())  # 2`,`from collections import deque\nq = deque([1, 2, 3])\nq.append(4)\nprint(q.popleft())  # 1`,`import heapq\nh = []\nfor n in [5, 1, 4]:\n    heapq.heappush(h, n)\nprint(heapq.heappop(h))  # 1\nprint(heapq.nlargest(2, [5, 1, 4]))`],"list.pop(0) as a queue is O(n). Use deque.","Stack = list, queue = deque, priority = heapq.","Best Python queue?",["list","deque","set"],1),
L("Binary Search Tree","Each node has a left child that is smaller and a right child that is larger. Search and insert are O(log n) on a balanced tree. In-order traversal visits values in sorted order.",[`class N:\n    def __init__(self, v):\n        self.v, self.l, self.r = v, None, None\ndef insert(n, v):\n    if not n: return N(v)\n    if v < n.v: n.l = insert(n.l, v)\n    else: n.r = insert(n.r, v)\n    return n`,`def search(n, v):\n    if not n or n.v == v: return n\n    return search(n.l if v < n.v else n.r, v)`,`def inorder(n):\n    if n:\n        yield from inorder(n.l)\n        yield n.v\n        yield from inorder(n.r)\nroot = None\nfor v in [5, 2, 8]:\n    root = insert(root, v)\nprint(list(inorder(root)))  # [2, 5, 8]`,`import bisect\nxs = [1, 3, 5]\nbisect.insort(xs, 4)\nprint(bisect.bisect_left(xs, 5))  # 3`],"Inserting sorted data into a plain BST makes it a slow chain.","Left smaller, right larger; in-order = sorted.","In-order traversal of a BST gives?",["random order","sorted order","reverse order"],1),
L("Recursion","A function that calls itself. It needs a base case to stop and a smaller problem each call. Python limits depth (about 1000), so deep problems may need loops.",[`def fact(n):\n    return 1 if n <= 1 else n * fact(n - 1)\nprint(fact(5))  # 120`,`from functools import lru_cache\n@lru_cache(None)\ndef fib(n):\n    return n if n < 2 else fib(n-1) + fib(n-2)\nprint(fib(50))`,`def flatten(x):\n    if not isinstance(x, list):\n        return [x]\n    return [y for i in x for y in flatten(i)]\nprint(flatten([1, [2, [3]]]))`],"No base case causes RecursionError.","Base case + smaller step.","What stops recursion?",["loop","base case","return None"],1),
L("Sorting Algorithms","Use sorted() or list.sort() in real code (Timsort, O(n log n)). Learn bubble sort (simple, O(n^2)) and merge sort (divide and conquer, O(n log n)) to understand how sorting works.",[`people = [("Ana", 30), ("Bo", 25)]\nprint(sorted(people, key=lambda p: p[1]))\nprint(sorted([3, 1, 2], reverse=True))`,`def bubble(a):\n    for i in range(len(a)):\n        for j in range(len(a) - i - 1):\n            if a[j] > a[j+1]:\n                a[j], a[j+1] = a[j+1], a[j]\n    return a`,`def msort(a):\n    if len(a) < 2: return a\n    m = len(a) // 2\n    l, r = msort(a[:m]), msort(a[m:])\n    out = []\n    while l and r:\n        out.append(l.pop(0) if l[0] <= r[0] else r.pop(0))\n    return out + l + r\nprint(msort([4, 1, 3, 2]))`],"sort() returns None; it sorts in place. Use sorted() for a new list.","Use sorted(key=...); merge sort is O(n log n).","list.sort() returns?",["new list","None","tuple"],1)
]},
{s:"3. Modules and Core Language",t:["Built-in Modules","Custom Modules","Error Handling","Lambda","Decorators","Iterators","Regular Expressions","Variable Scope"].map(T)},
{s:"4. Package Managers",t:["PyPI","Pip","Conda","uv","Poetry","pdm","Common Packages","pyproject.toml"].map(T)},
{s:"5. Object Oriented Programming",t:["Classes","Methods","Inheritance","Encapsulation","List Comprehensions","Generator Expressions","Paradigms","Context Manager"].map(T)},
{s:"6. Frameworks",t:["Flask","Django","FastAPI","Pyramid","Tornado","Sanic","aiohttp"].map(T)},
{s:"7. Concurrency",t:["Multiprocessing","Asynchrony","GIL","Threading"].map(T)},
{s:"8. Environments, Typing, Formatting",t:["pipenv","virtualenv","pyenv","typing","mypy","pyright","Pydantic","yapf","black","ruff","Sphinx"].map(T)},
{s:"9. Files and Testing",t:["File Handling","unittest / PyUnit","doctest","pytest","tox"].map(T)}
];

</script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const add=(k,n)=>{const d=new Date(k+"T00:00");d.setDate(d.getDate()+n);return dk(d)};
const today=dk(new Date());
let days=ld("days",[]),prog=ld("prog",{}),IV=[1,3,7,30];
if(!days.includes(today)){days.push(today);sv("days",days)}
const SEC=typeof SECTIONS!=="undefined"?SECTIONS:[],all=SEC.flatMap(s=>s.t);
const key=n=>n.n;
const D="https://docs.python.org/3/",R="https://realpython.com/";
const A=(c,p)=>"Automate the Boring Stuff, Ch "+c+" (p."+p+")",F=(c,t,p)=>"Fluent Python, Ch "+c+": "+t+" (p."+p+")",E=(i,p)=>"Effective Python, "+i+" (p."+p+")",P=c=>"Python Crash Course, "+c;
const REFS={
"Basic Syntax":[[A(2,27),P("Ch 5, if Statements")],[["Tutorial: control flow",D+"tutorial/controlflow.html"],["Tutorial: first steps",D+"tutorial/introduction.html"]]],
"Variables and Data Types":[[A(1,3),P("Ch 2, Variables and Simple Data Types")],[["Built-in types",D+"library/stdtypes.html"]]],
"Operators":[[A(1,3)],[["Numeric types",D+"library/stdtypes.html#numeric-types-int-float-complex"]]],
"Working with Strings":[[A(8,159),F(4,"Text versus Bytes",97),E("Item 4: f-strings",11)],[["String methods",D+"library/stdtypes.html#string-methods"],["Format strings",D+"tutorial/inputoutput.html"]]],
"Loops":[[A(3,49),E("Items 7-9, enumerate/zip/else",28),P("Ch 7, User Input and while Loops"),"Big Book of Small Python Projects: Project 1, Bagels (p.1) uses loops"],[["More control flow",D+"tutorial/controlflow.html"]]],
"List":[[A(6,109),F(2,"An Array of Sequences",19),E("Items 11-14",43),P("Ch 3-4"),"Big Book: Project 4, Blackjack (p.15) uses lists"],[["Lists in the tutorial",D+"tutorial/datastructures.html#more-on-lists"]]],
"Tuple":[[F(2,"An Array of Sequences",19),E("Item 6: unpacking",25)],[["Tuples and sequences",D+"tutorial/datastructures.html#tuples-and-sequences"]]],
"Set":[[F(3,"Dictionaries and Sets",63)],[["Sets",D+"tutorial/datastructures.html#sets"]]],
"Dictionary":[[A(7,139),F(3,"Dictionaries and Sets",63),E("Items 15-18",55),P("Ch 6, Dictionaries")],[["Dictionaries",D+"tutorial/datastructures.html#dictionaries"]]],
"Type Casting":[[A(1,3)],[["Built-in functions",D+"library/functions.html"]]],
"Functions and Built-in Functions":[[A(4,73),E("Chapter 3",77),F(5,"First-Class Functions",139),P("Ch 8, Functions")],[["Defining functions",D+"tutorial/controlflow.html#defining-functions"],["Built-ins",D+"library/functions.html"]]],
"Exceptions":[[A(5,95),E("Item 65, try/except blocks",301),P("Ch 10, Files and Exceptions")],[["Errors and exceptions",D+"tutorial/errors.html"]]],
"Comments":[[E("Item 2: PEP 8",2)],[["PEP 8",  "https://peps.python.org/pep-0008/"]]],
"Type Annotations":[[],[["typing module",D+"library/typing.html"],["Type hints cheat sheet","https://mypy.readthedocs.io/en/stable/cheat_sheet_py3.html"]]],
"Arrays and Linked Lists":[[F(2,"An Array of Sequences",19),E("Item 71: deque",326)],[["Linked lists",R+"linked-lists-python/"],["Time complexity",  "https://wiki.python.org/moin/TimeComplexity"]]],
"HashMap":[[F(3,"Dictionaries and Sets",63),A(7,139)],[["Dicts",R+"python-dicts/"],["collections",D+"library/collections.html"]]],
"Heap, Stack and Queue":[[E("Item 71: deque",326),E("Item 55: Queue",238)],[["heapq",D+"library/heapq.html"],["Stacks and queues",R+"python-data-structures/"]]],
"Binary Search Tree":[[E("Item 72: bisect",329)],[["bisect",D+"library/bisect.html"],["Binary search",R+"binary-search-python/"]]],
"Recursion":[["No dedicated chapter in your PDFs; use the links"],[["Recursion",R+"python-recursion/"],["lru_cache",D+"library/functools.html#functools.lru_cache"]]],
"Sorting Algorithms":[[E("Item 14: sort by key",52)],[["Sorting HOWTO",D+"howto/sorting.html"],["Sorting algorithms",R+"sorting-algorithms-python/"]]]
};
all.forEach(t=>{const r=REFS[t.n];if(r){t.p=r[0];t.w=r[1]}});
const exs=t=>[].concat(t.c).map((c,i)=>`<div class="m" style="color:var(--mu);font-size:13px">Example ${i+1}</div><pre>${esc(c)}</pre>`).join("");
const refs=t=>(t.p&&t.p.length?`<h2>Read more in your PDFs</h2><div class="card">${t.p.map(x=>"• "+esc(x)).join("<br>")}</div>`:"")+(t.w?`<h2>Read more online</h2><div class="card">${t.w.map(x=>`• <a style="color:var(--ac)" target="_blank" rel="noopener" href="${x[1]}">${esc(x[0])}</a>`).join("<br>")}</div>`:"");

function streaks(){const s=new Set(days);let cur=0,d=today;if(!s.has(d))d=add(d,-1);while(s.has(d)){cur++;d=add(d,-1)}
 let best=0,run=0,prev=null;[...s].sort().forEach(x=>{run=prev&&add(prev,1)===x?run+1:1;best=Math.max(best,run);prev=x});return{cur,best}}
function due(){return all.filter(t=>{const p=prog[key(t)];return p&&p.n<4&&today>=add(p.d,IV[p.n])})}
function go(i){$("n0").className=i?"":"a";$("n1").className=i?"a":"";i?streak():home();scrollTo(0,0)}
function home(){if(!all.length){$("app").innerHTML="<h1>Lessons file not found</h1><p>The app cannot find <b>lessons.js</b>. In your GitHub repository, make sure a file named exactly <b>lessons.js</b> (lowercase, no spaces or (1)) sits in the same folder as index.html. Then reload the page twice.</p>";return}const dn=all.filter(t=>prog[key(t)]).length,dv=due();
 let h=`<h1>PyPath</h1><div class="m">${dn} of ${all.length} topics done</div><div class="bar"><i style="width:${dn/all.length*100}%"></i></div>`;
 if(dv.length)h+=`<h2>Review today</h2>`+dv.map(t=>btn(t)).join("");
 SEC.forEach(s=>{h+=`<h2>${s.s}</h2>`+s.t.map(btn).join("")});$("app").innerHTML=h}
const btn=t=>`<button class="t ${t.b?"":"na"}" onclick="open_('${key(t).replace(/'/g,"\\'")}')"><span>${esc(t.n)}</span><span class="ok">${prog[key(t)]?"✓":""}</span></button>`;
function open_(k){const t=all.find(x=>key(x)===k);if(!t.b){$("app").innerHTML=`<button class="b g" onclick="go(0)">Back</button><h1>${esc(t.n)}</h1><p>This lesson is not written yet. Ask Claude for the next batch and paste it into lessons.js.</p>`;return}
 const p=prog[k];$("app").innerHTML=`<button class="b g" onclick="go(0)">Back</button><h1>${esc(t.n)}</h1><p>${esc(t.b)}</p>${exs(t)}
 <div class="card"><b>Common mistake.</b> ${esc(t.m)}</div><div class="card"><b>Remember.</b> ${esc(t.r)}</div>
 ${refs(t)}<h2>Quick check</h2><div><b>${esc(t.q)}</b>${t.o.map((o,i)=>`<button class="o" onclick="ans(this,${i},${t.a})">${esc(o)}</button>`).join("")}</div>
 <button class="b" onclick="done('${k.replace(/'/g,"\\'")}')">${p?(due().includes(t)?"Mark reviewed":"Done ✓"):"Mark as done"}</button>`}
function ans(b,i,a){b.style.borderColor=i===a?"var(--ok)":"#d9534f"}
function done(k){const p=prog[k],t=all.find(x=>key(x)===k);if(!p)prog[k]={d:today,n:0};else if(due().includes(t))p.n++;sv("prog",prog);go(0)}
function streak(){const{cur,best}=streaks(),now=new Date(),y=now.getFullYear(),m=now.getMonth(),dim=new Date(y,m+1,0).getDate(),off=(new Date(y,m,1).getDay()+6)%7;
 const mc=days.filter(d=>d.startsWith(y+"-"+String(m+1).padStart(2,"0"))).length,yc=days.filter(d=>d.startsWith(y+"-")).length;
 let c=["M","T","W","T","F","S","S"].map(x=>`<div>${x}</div>`).join("")+"<div style='background:none'></div>".repeat(off);
 for(let i=1;i<=dim;i++){const k=y+"-"+String(m+1).padStart(2,"0")+"-"+String(i).padStart(2,"0");c+=`<div class="${days.includes(k)?"on":""}">${i}</div>`}
 $("app").innerHTML=`<h1>Your streak</h1><div class="row"><div class="card"><div class="big">${cur}</div>day streak</div><div class="card"><div class="big">${best}</div>best streak</div></div>
 <div class="row"><div class="card"><b>${days.includes(today)?1:0}</b> today</div><div class="card"><b>${mc}</b> this month</div><div class="card"><b>${yc}</b> this year</div></div>
 <h2>${now.toLocaleString("en",{month:"long",year:"numeric"})}</h2><div class="cal">${c}</div>
 <h2>Daily reminder</h2><div class="card"><input type="time" id="rt" value="${ld("rt","19:00")}" onchange="sv('rt',this.value)"> <button class="b" onclick="remind()">Enable</button>
